name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write  # required to create GitHub Releases and upload assets

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java (required by Gradle) ─────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ── 3. Set up Flutter ────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      # ── 4. Restore sensitive files from secrets ──────────────────────────
      # google-services.json and local.properties are gitignored.
      # Store their contents as GitHub Actions secrets:
      #   GOOGLE_SERVICES_JSON  — full content of mobile/android/app/google-services.json
      #   LOCAL_PROPERTIES      — full content of mobile/android/local.properties
      #                           (must include MAPS_API_KEY=<your-key>)
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json

      - name: Write local.properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: echo "$LOCAL_PROPERTIES" > mobile/android/local.properties

      # ── 5. Install Flutter dependencies ─────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/*.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      # ── 6. Build release APK ─────────────────────────────────────────────
      # Restores your local debug keystore so the SHA-1 matches what is
      # registered in Firebase — required for Google Sign-In to work.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=BACKEND_URL=${{ secrets.BACKEND_URL }}

      # ── 7. Print APK signing certificate SHA-1 ──────────────────────────
      # Used to verify the SHA-1 registered in Firebase matches the built APK.
      - name: Print APK SHA-1
        run: |
          keytool -printcert -jarfile \
            mobile/build/app/outputs/flutter-apk/app-release.apk \
            | grep -A1 "SHA1:"

      # ── 8. Create both a versioned and a fixed-name latest APK ──────────
      # civic-sync-latest.apk is what the landing page download button links to.
      # The versioned copy is attached for reference.
      - name: Prepare APK artifacts
        run: |
          VERSION="${{ github.ref_name }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk \
             mobile/build/app/outputs/flutter-apk/civic-sync-${VERSION}.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk \
             mobile/build/app/outputs/flutter-apk/civic-sync-latest.apk

      # ── 8. Create GitHub Release and upload both APKs ────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CivicSync ${{ github.ref_name }}
          body: |
            ## CivicSync ${{ github.ref_name }}

            ### Installation
            1. Download **civic-sync-latest.apk** below
            2. Enable "Install from unknown sources" on your Android device
            3. Open the APK to install

            ### Changes
            See commit history for details.
          files: |
            mobile/build/app/outputs/flutter-apk/civic-sync-${{ github.ref_name }}.apk
            mobile/build/app/outputs/flutter-apk/civic-sync-latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
